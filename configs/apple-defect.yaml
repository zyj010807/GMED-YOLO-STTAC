# Apple and surface-defect detection dataset format used by GMED-YOLO.

path: /path/to/apple-defect-dataset
train:
  - images/train
  - images/train_augmented/motion_blur
  - images/train_augmented/horizontal_flip
  - images/train_augmented/random_rotation
  - images/train_augmented/gaussian_noise
  - images/train_augmented/brightness
val: images/val
test: images/test

names:
  0: apple
  1: puncture
  2: bruise
  3: bitter pit
